  - id: fixed_value_1
    name: '固定值 1 ("id":"1")'
    template: '"{param}":"1"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: fixed_value_2
    name: '固定值 2 ("id":"2")'
    template: '"{param}":"2"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: fixed_value_3
    name: '固定值 3 ("id":"3")'
    template: '"{param}":"3"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
