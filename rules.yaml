rules:
  - id: value_dot_zero
    name: '值后加.0 ("id":123.0)'
    template: '"{param}":"{value}.0"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: value_dot_one
    name: '值后加.1 ("id":123.1)'
    template: '"{param}":"{value}.1"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true
  
  - id: param_upper
    name: '参数名全大写 ("ID":"value")'
    template: '"{param_upper}":"{value}"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true
  
  - id: value_prefix_zwsp
    name: '值前加零宽度空格(U+200B)'
    template: '"{param}":"​{value}"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true
  
  - id: value_prefix_hanguozifu
    name: '值前加隐形字符(韩国)'
    template: '"{param}":"ᅠ{value}"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true
  
  - id: value_prefix_kongge
    name: '值前加空格'
    template: '"{param}":" {value}"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: value_prefix_0a
    name: '值前加%0a ("id":"%0a123")'
    template: '"{param}":"%0a{value}"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: value_zero_prefix
    name: '值前加0 ("id":"01")'
    template: '"{param}":"0{value}"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true
  
  - id: fixed_value_asterisk
    name: '固定值 * ("id":"*")'
    template: '"{param}":"*"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: fixed_value_percent
    name: '固定值 % ("id":"%")'
