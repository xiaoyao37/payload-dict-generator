  - id: fixed_value_99999999999
    name: '固定值 99999999999 ("id":"99999999999")'
    template: '"{param}":"99999999999"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true
  

  - id: value_empty
    name: '参数值置空 (id= / "id":"")'
    template: '"{param}":""'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: hpp_duplicate_reverse
    name: 'HPP重复反向 (id=124&id=123)'
    template: '{param}={extra}&{param}={value}'
    formats: ['url', 'form']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_duplicate_forward
    name: 'HPP重复正向 (id=123&id=124)'
    template: '{param}={value}&{param}={extra}'
    formats: ['url', 'form']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_comma_forward
    name: 'HPP逗号正向 (id=123,124)'
    template: '{param}={value},{extra}'
    formats: ['url', 'form']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_comma_reverse
    name: 'HPP逗号反向 (id=124,123)'
    template: '{param}={extra},{value}'
    formats: ['url', 'form']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_bracket_array
    name: 'HPP方括号数组 (id=[123,124])'
    template: '{param}=[{value},{extra}]'
    formats: ['url', 'form']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_bracket_reverse
    name: 'HPP方括号数组反向 (id=[124,123])'
    template: '{param}=[{extra},{value}]'
    formats: ['url', 'form']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_json_array_forward
    name: 'HPP JSON数组正向 ("id":["123","124"])'
    template: '"{param}":["{value}","{extra}"]'
    formats: ['json']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_json_array_reverse
    name: 'HPP JSON数组反向 ("id":["124","123"])'
    template: '"{param}":["{extra}","{value}"]'
    formats: ['json']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_json_duplicate_forward
    name: 'HPP JSON重复正向 ("id":"123","id":"124")'
    template: '"{param}":"{value}","{param}":"{extra}"'
    formats: ['json']
    hpp: true
    encode: none
    enabled: true
    need_extra: true

  - id: hpp_json_duplicate_reverse
    name: 'HPP JSON重复反向 ("id":"124","id":"123")'
    template: '"{param}":"{extra}","{param}":"{value}"'
    formats: ['json']
    hpp: true
    encode: none
    enabled: true
    need_extra: true