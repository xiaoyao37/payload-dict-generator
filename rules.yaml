    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: fixed_value_percent_a
    name: '固定值 %a ("id":"%a")'
    template: '"{param}":"%a"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: fixed_value_underscore
    name: '固定值 _ ("id":"_")'
    template: '"{param}":"_"'
    formats: ['url', 'form', 'json']
    hpp: false
    encode: none
    enabled: true

  - id: fixed_value_abc
    name: '固定值 abc ("id":"abc")'
    template: '"{param}":"abc"'
    formats: ['url', 'form', 'json']
